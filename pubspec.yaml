name: studymate
description: StudyMate - a simple student study planner built with Flutter and Supabase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.4
  google_fonts: ^8.2.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  supabase_flutter: ^2.18.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
